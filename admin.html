<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Anvex Media</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="style.css">

    <style>
        body { padding-top: 100px; min-height: 100vh; }
        .dashboard-container { width: 95%; max-width: 1400px; margin: 0 auto; padding-bottom: 5rem; }
        .dash-tabs { display: flex; gap: 15px; margin-bottom: 30px; border-bottom: 1px solid var(--glass-border); padding-bottom: 15px; overflow-x: auto; scrollbar-width: none; }
        .dash-tabs::-webkit-scrollbar { display: none; }
        .tab-btn { background: transparent; border: 1px solid var(--glass-border); color: var(--text-muted); padding: 12px 24px; border-radius: 12px; font-family: var(--font-main); font-weight: 600; cursor: pointer; transition: all 0.3s ease; white-space: nowrap; }
        .tab-btn.active { background: var(--gradient-primary); color: white; border-color: transparent; box-shadow: 0 5px 15px rgba(0, 210, 255, 0.3); }
        .tab-content { display: none; animation: fadeIn 0.4s ease; }
        .tab-content.active { display: block; }

        .inquiry-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
        .inquiry-card { padding: 1.5rem; transition: transform 0.3s; }
        .inquiry-card:hover { transform: translateY(-5px); }
        .inquiry-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; border-bottom: 1px solid var(--glass-border); padding-bottom: 10px; }
        .badge { padding: 5px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
        .badge-user { background: rgba(0, 210, 255, 0.15); color: var(--accent-blue); border: 1px solid var(--accent-blue); }
        .badge-inq { background: rgba(37, 211, 102, 0.15); color: #25d366; border: 1px solid #25d366; }

        .inquiry-details p { margin-bottom: 8px; font-size: 0.9rem; color: #e2e8f0; }
        .inquiry-details i { color: var(--accent-blue); width: 20px; text-align: center; margin-right: 8px; }
        .package-box { background: rgba(0,0,0,0.3); padding: 12px; border-radius: 8px; margin-top: 15px; border: 1px dashed var(--glass-border); }
        .package-box h5 { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 5px; text-transform: uppercase; }

        .progress-controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .progress-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .update-box { background: rgba(0,0,0,0.2); padding: 20px; border-radius: 16px; border: 1px solid var(--glass-border); }
        textarea.glass-input { width: 100%; height: 120px; background: rgba(255,255,255,0.02); border: 1px solid var(--glass-border); border-radius: 12px; padding: 15px; color: white; font-family: var(--font-main); resize: vertical; outline: none; margin-bottom: 15px; }
        textarea.glass-input:focus { border-color: var(--accent-blue); }
        .metrics-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; background: rgba(255,255,255,0.03); padding: 10px 15px; border-radius: 8px; }
        .metrics-row input, .progress-controls select { background: var(--bg-dark); border: 1px solid var(--accent-blue); color: white; padding: 8px; border-radius: 6px; font-weight: bold; outline: none; }
        .progress-controls select { width: 100%; padding: 10px; font-family: var(--font-main); }
        .metrics-row input { width: 70px; text-align: center; }

        #toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px); background: #25d366; color: white; padding: 12px 25px; border-radius: 30px; font-weight: 600; box-shadow: 0 10px 20px rgba(37, 211, 102, 0.4); opacity: 0; transition: all 0.4s ease; z-index: 9999; }
        #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

        .top-nav { position: fixed; top: 0; left: 0; width: 100%; z-index: 9999; background: rgba(5, 10, 20, 0.95); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255,255,255,0.05); padding: 12px 5%; display: flex; justify-content: space-between; align-items: center; box-sizing: border-box; }
        .nav-left { flex: 1; display: flex; justify-content: flex-start; align-items: center; }
        .nav-right { flex: 1; display: flex; justify-content: flex-end; align-items: center; gap: 15px; }
        .nav-center { position: absolute; left: 50%; transform: translateX(-50%); display: flex; justify-content: center; align-items: center; }
        
        .mobile-only { display: none !important; }
        .desktop-only { display: flex !important; align-items: center; }
        .mobile-title-container { display: none; }
        
        @media (max-width: 900px) { 
            .progress-grid { grid-template-columns: 1fr; } 
            .desktop-only { display: none !important; }
            .mobile-only { display: flex !important; align-items: center; justify-content: center; } 
            .mobile-title-container { display: block; text-align: center; margin-bottom: 25px; padding-top: 5px; }
            body { padding-top: 85px; } 
        }

        .plan-features-list { list-style: none; padding: 0; margin: 15px 0 0 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
        .plan-features-list li { font-size: 0.85rem; color: #e2e8f0; display: flex; align-items: center; }
        .plan-features-list li i { color: #25d366; margin-right: 8px; font-size: 1rem; }
    </style>
</head>
<body>

    <div class="futuristic-bg">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <nav id="navbar" class="top-nav">
        <div class="nav-left">
            <a href="index.html" class="nav-logo desktop-only"><img src="logo1.png" alt="Anvex Media Logo" style="height: 45px;"></a>
            <a href="index.html" class="mobile-only" style="color: var(--text-muted); text-decoration: none; font-size: 1.4rem;"><i class="fas fa-home"></i></a>
        </div>
        <div class="nav-center">
            <h1 class="desktop-only" style="font-size: 1.3rem; margin: 0; color: white; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;">Admin <span class="gradient-text">Dashboard</span></h1>
            <a href="index.html" class="nav-logo mobile-only"><img src="logo1.png" alt="Anvex Media Logo" style="height: 35px;"></a>
        </div>
        <div class="nav-right">
            <a href="index.html" class="desktop-only" style="color: var(--text-muted); text-decoration: none; font-size: 0.85rem; font-weight: 600; transition: 0.3s;" onmouseover="this.style.color='white'" onmouseout="this.style.color='var(--text-muted)'"><i class="fas fa-home"></i> Home</a>
            <a href="#" class="btn btn-secondary" style="padding: 8px 15px; font-size: 0.8rem; color: #ff4d4d; border-color: rgba(255, 77, 77, 0.3);" onclick="firebase.auth().signOut().then(() => { window.location.href='index.html'; })"><i class="fas fa-power-off"></i> Logout</a>
        </div>
    </nav>

    <div class="mobile-title-container">
        <h1 style="font-size: 1.5rem; margin: 0; color: white; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;">Admin <span class="gradient-text">Dashboard</span></h1>
    </div>

    <div class="dashboard-container fade-up visible">
        
        <div class="dash-tabs">
            <button class="tab-btn active" onclick="switchTab('inquiries')"><i class="fas fa-inbox"></i> New Inquiries</button>
            <button class="tab-btn" onclick="switchTab('progress')"><i class="fas fa-tasks"></i> Client Work Progress</button>
        </div>

        <div id="inquiries" class="tab-content active">
            <h2 style="margin-bottom: 20px;">Action <span class="gradient-text">Required</span></h2>
            
            <div class="inquiry-grid" id="inquiryGrid">
                <p style="color: var(--text-muted); font-size: 1.1rem;"><i class="fas fa-spinner fa-spin"></i> Securely loading inquiries...</p>
            </div>
        </div>

        <div id="progress" class="tab-content">
            <h2 style="margin-bottom: 20px;">Client <span class="gradient-text">Progress Updater</span></h2>
            
            <div class="glass" style="padding: 2rem;">
                
                <div class="progress-controls">
                    <div class="input-group">
                        <label style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 5px; display: block;">Select Accepted Client</label>
                        <select id="clientSelect">
                            <option value="">Loading Active Clients...</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 5px; display: block;">Reporting Month</label>
                        <!-- Automatically Generated by JavaScript -->
                        <select id="monthSelect">
                            <option value="">Loading Months...</option>
                        </select>
                    </div>
                    
                    <div id="adminSelectedPlanBox" style="grid-column: 1 / -1; background: rgba(0,210,255,0.05); padding: 20px; border: 1px dashed var(--accent-blue); border-radius: 12px; display: none; margin-top: 10px;">
                        <p style="margin: 0 0 10px 0; font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; font-weight: bold;">Client's Active Package</p>
                        <div id="adminSelectedPlanText">...</div>
                    </div>
                </div>

                <div class="progress-grid">
                    
                    <div class="update-box">
                        <h4 style="margin-bottom: 15px; color: var(--accent-blue);"><i class="fas fa-chart-pie"></i> Deliverables Tracker</h4>
                        <div class="metrics-row">
                            <span>Instagram Reels Uploaded</span>
                            <div><input type="number" id="reelsCount" value="0" min="0"></div>
                        </div>
                        <div class="metrics-row">
                            <span>Graphic Posters Designed</span>
                            <div><input type="number" id="postersCount" value="0" min="0"></div>
                        </div>
                        <div class="metrics-row">
                            <span>Ad Campaigns Active</span>
                            <div><input type="number" id="adsCount" value="0" min="0"></div>
                        </div>
                        <div class="metrics-row">
                            <span>Total Leads Generated</span>
                            <div><input type="number" id="leadsCount" value="0" min="0"></div>
                        </div>
                    </div>

                    <div class="update-box">
                        <h4 style="margin-bottom: 15px; color: var(--accent-purple);"><i class="fas fa-list-check"></i> Task Status</h4>
                        <label style="font-size: 0.85rem; color: var(--text-muted); display: block; margin-bottom: 5px;">Tasks Completed (Hit Enter for new line)</label>
                        <textarea id="tasksCompleted" class="glass-input" placeholder="e.g.&#10;Shot 5 raw videos&#10;Launched ad campaign"></textarea>

                        <label style="font-size: 0.85rem; color: var(--text-muted); display: block; margin-bottom: 5px;">Tasks Remaining (Hit Enter for new line)</label>
                        <textarea id="tasksRemaining" class="glass-input" placeholder="e.g.&#10;Edit remaining 3 reels&#10;Send analytics report"></textarea>
                    </div>

                </div>

                <button class="btn btn-primary" style="width: 100%; margin-top: 20px; padding: 16px; font-size: 1.1rem;" id="saveProgressBtn">
                    <i class="fas fa-cloud-upload-alt"></i> Send Update to Client Dashboard
                </button>

            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast">Update Successful!</div>

    <!-- FIREBASE SCRIPTS -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>

    <script>
        const monthSelect = document.getElementById('monthSelect');
        if (monthSelect) {
            monthSelect.innerHTML = '';
            const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            const today = new Date();
            let currYear = today.getFullYear();
            let currM = today.getMonth();

            if(currYear < 2026) currYear = 2026;

            for (let y = 2026; y <= currYear; y++) {
                let endM = (y === currYear) ? currM : 11;
                for (let m = 0; m <= endM; m++) {
                    let mStr = `${monthNames[m]} ${y}`;
                    let opt = document.createElement('option');
                    opt.value = mStr;
                    opt.text = mStr;
                    monthSelect.insertBefore(opt, monthSelect.firstChild);
                }
            }
        }

        window.history.pushState(null, "", window.location.href);
        window.onpopstate = function() { window.location.replace("index.html"); };

        const firebaseConfig = {
            apiKey: atob("QUl6YVN5QXh4MzBETFBzVV9DcU1xaWhTMUhFLTNrTWdSeFkzb2lv"),
            authDomain: "anvex-media.firebaseapp.com",
            projectId: "anvex-media",
            storageBucket: "anvex-media.firebasestorage.app",
            messagingSenderId: "941745194100",
            appId: "1:941745194100:web:8a6b718bb4bd54d9733d21"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        function switchTab(tabId) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            event.currentTarget.classList.add('active');
            document.getElementById(tabId).classList.add('active');
        }

        auth.onAuthStateChanged(async (user) => {
            if (!user) { window.location.replace('login.html'); return; }
            const doc = await db.collection('users').doc(user.email).get();
            if (!doc.exists || doc.data().role !== 'admin') { window.location.replace('index.html'); } 
            else { fetchInquiries(); fetchClients(); }
        });

        function getPlanFeatures(planString) {
            if (!planString) return ["Awaiting Setup"];
            if (planString.includes("Starter")) {
                return ["5 Reels + 3 Posters", "Professional Reel Editing", "Trend Research", "Caption & Hashtag Strategy", "Instagram/Facebook Management", "Monthly Content Planning", "Basic Lead Generation Setup", "2 Revisions"];
            } else if (planString.includes("Growth")) {
                return ["8-10 Reels + 5 Posters", "Advanced Editing & Motion Graphics", "Content Strategy & Reel Concepts", "Full Social Media Management", "Lead Generation Campaigns", "Audience Targeting Optimization", "Monthly Performance Report", "Priority Support", "3 Revisions"];
            } else if (planString.includes("Custom Package")) {
                let featuresPart = planString.includes(": ") ? planString.split(": ")[1] : planString.replace("Custom Package: ", "");
                if(!featuresPart) return ["Custom features pending"];
                return featuresPart.split(" | ");
            }
            return [planString];
        }

        function formatPlanDisplay(planString) {
            if (!planString) return "Awaiting Setup";
            if (planString.startsWith("Custom Package")) {
                let parts = planString.split(": ");
                return parts[0].replace("Custom Package", "Custom Built Package");
            }
            return planString;
        }

        function buildCard(id, type, name, business, location, contact, details) {
            const badgeClass = type === 'user' ? 'badge-user' : 'badge-inq';
            const badgeText = type === 'user' ? 'New Client Signup' : 'Form Inquiry';
            
            let buttonsHtml = '';
            if (type === 'user' && details === 'Awaiting Plan Selection') {
                buttonsHtml = `<button class="btn btn-secondary" style="padding: 10px; width: 100%; font-size: 0.8rem;" onclick="openChat('${contact}')"><i class="fas fa-comment-dots"></i> Chat</button>`;
            } else {
                buttonsHtml = `
                    <button class="btn btn-secondary" style="padding: 10px; width: 50%; font-size: 0.8rem;" onclick="openChat('${contact}')"><i class="fas fa-comment-dots"></i> Chat</button>
                    <button class="btn btn-primary" style="padding: 10px; width: 50%; font-size: 0.8rem;" onclick="acceptLead('${id}', '${type}', this)"><i class="fas fa-check"></i> Accept</button>
                `;
            }

            let displayDetails = details;
            if(details.includes("Custom Package")) {
                let stripped = details.replace("Selected Plan: ", "");
                let parts = stripped.split(": ");
                let title = parts[0].replace("Custom Package", "Custom Built Package");
                let featureString = parts.length > 1 ? parts[1].split(" | ").join("<br><i class='fas fa-check' style='color:#25d366; font-size: 0.7rem;'></i> ") : "";
                displayDetails = `<strong>${title}</strong><br><i class='fas fa-check' style='color:#25d366; font-size: 0.7rem;'></i> ${featureString}`;
            }

            return `
            <div class="glass inquiry-card">
                <div class="inquiry-header">
                    <div><span class="badge ${badgeClass}">${badgeText}</span></div>
                    <span style="font-size: 0.75rem; color: var(--text-muted);"><i class="fas fa-clock"></i> Waiting Action</span>
                </div>
                <div class="inquiry-details">
                    <p><i class="fas fa-user"></i> <strong>${name || 'Not Provided'}</strong></p>
                    <p><i class="fas fa-store"></i> ${business || 'Not Provided'}</p>
                    <p><i class="fas fa-map-marker-alt"></i> ${location || 'Not Provided'}</p>
                    <p><i class="fas fa-envelope"></i> ${contact || 'Not Provided'}</p>
                    
                    <div class="package-box">
                        <h5>Requested Details</h5>
                        <p style="margin:0; font-size: 0.85rem; color: var(--accent-blue); line-height: 1.5;">${displayDetails}</p>
                    </div>
                </div>
                <div style="margin-top: 15px; display: flex; gap: 10px;">
                    ${buttonsHtml}
                </div>
            </div>`;
        }

        function openChat(contact) {
            if (contact && contact.includes('@')) { window.location.href = `mailto:${contact}`; } 
            else { window.open(`https://wa.me/918011595012`, '_blank'); }
        }

        async function acceptLead(id, type, btnElement) {
            btnElement.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
            try {
                if (type === 'user') { await db.collection('users').doc(id).update({ status: 'active' }); } 
                else { await db.collection('inquiries').doc(id).update({ status: 'accepted' }); }
                
                const toast = document.getElementById('toast');
                toast.innerText = "Accepted successfully! Client moved to Work Progress.";
                toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 3000);
                
                fetchInquiries(); fetchClients(); 
            } catch(e) { console.error(e); alert("Error accepting lead."); btnElement.innerHTML = '<i class="fas fa-check"></i> Accept'; }
        }

        async function fetchInquiries() {
            const grid = document.getElementById('inquiryGrid');
            grid.innerHTML = ''; let hasData = false;

            try {
                const inqSnap = await db.collection('inquiries').get();
                inqSnap.forEach(doc => {
                    const data = doc.data();
                    if (data.status === 'new') {
                        hasData = true;
                        grid.innerHTML += buildCard(doc.id, 'inquiry', data.name, data.business, data.location, data.preferredTime, data.packageType);
                    }
                });

                const userSnap = await db.collection('users').where('role', '==', 'client').get();
                userSnap.forEach(doc => {
                    const data = doc.data();
                    if (data.status !== 'active') { 
                        hasData = true;
                        const requestDetails = data.selectedPlan ? `Selected Plan: ${data.selectedPlan}` : 'Awaiting Plan Selection';
                        grid.innerHTML += buildCard(doc.id, 'user', data.fullName, data.businessName, data.location, data.email, requestDetails);
                    }
                });

                if (!hasData) { grid.innerHTML = '<p style="color: var(--text-muted); font-style: italic;"><i class="fas fa-check-circle"></i> You are all caught up! No pending inquiries or signups.</p>'; }
            } catch(e) { console.error(e); grid.innerHTML = '<p style="color: #ff4d4d;">Error securely loading data.</p>'; }
        }

        async function fetchClients() {
            const select = document.getElementById('clientSelect');
            try {
                const snapshot = await db.collection('users').where('role', '==', 'client').get();
                select.innerHTML = '<option value="" disabled selected>Select an active client...</option>';
                
                let activeCount = 0;
                snapshot.forEach(doc => {
                    const clientData = doc.data();
                    if(clientData.status === 'active') {
                        activeCount++;
                        select.innerHTML += `<option value="${clientData.email}" data-plan="${clientData.selectedPlan || 'Custom Package'}">${clientData.businessName} (${clientData.fullName})</option>`;
                    }
                });
                if(activeCount === 0) { select.innerHTML += '<option value="" disabled>No active clients yet. Accept an inquiry first.</option>'; }
            } catch (error) { console.error("Error loading clients: ", error); }
        }

        document.getElementById('clientSelect').addEventListener('change', function() {
            const selectedOption = this.options[this.selectedIndex];
            const plan = selectedOption.getAttribute('data-plan');
            const planBox = document.getElementById('adminSelectedPlanBox');
            
            if(plan && plan !== "null" && plan !== "") {
                planBox.style.display = 'block';
                
                const features = getPlanFeatures(plan);
                let displayTitle = formatPlanDisplay(plan);
                
                let listHtml = `<h4 style="color: white; font-size: 1.1rem; margin-bottom: 10px; line-height: 1.4;">${displayTitle}</h4><ul class="plan-features-list">`;
                features.forEach(f => { listHtml += `<li><i class="fas fa-check-circle"></i> ${f}</li>`; });
                listHtml += `</ul>`;
                
                document.getElementById('adminSelectedPlanText').innerHTML = listHtml;
            } else {
                planBox.style.display = 'none';
            }
        });

        document.getElementById('saveProgressBtn').addEventListener('click', async (e) => {
            const btn = e.currentTarget;
            const clientEmail = document.getElementById('clientSelect').value;
            const month = document.getElementById('monthSelect').value;

            if (!clientEmail) { alert("Please select an active client from the dropdown first!"); return; }

            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Pushing to Database...';
            btn.disabled = true;

            try {
                await db.collection('progress').doc(`${clientEmail}_${month}`).set({
                    clientEmail: clientEmail,
                    month: month,
                    reels: document.getElementById('reelsCount').value,
                    posters: document.getElementById('postersCount').value,
                    ads: document.getElementById('adsCount').value,
                    leads: document.getElementById('leadsCount').value,
                    tasksCompleted: document.getElementById('tasksCompleted').value,
                    tasksRemaining: document.getElementById('tasksRemaining').value,
                    lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
                });

                const toast = document.getElementById('toast');
                toast.innerText = "Dashboard successfully updated!";
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 3000);
            } catch (error) { console.error("Error saving progress: ", error); alert("Failed to push update. Check your internet connection."); } 
            finally { btn.innerHTML = originalText; btn.disabled = false; }
        });
    </script>
</body>
</html>
