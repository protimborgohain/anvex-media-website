<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Sign Up | Anvex Media</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Compact Form Overrides */
        .login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 20px; /* Prevents touching the top/bottom of the screen */
        }
        
        .compact-card {
            width: 100%;
            max-width: 400px; /* Narrower, more organized width */
            padding: 2rem !important; /* Tighter inner padding */
            border-radius: 20px;
        }

        .compact-card img {
            height: 45px; /* Scaled down logo */
            margin-bottom: 1rem;
        }

        .compact-card h2 {
            font-size: 1.5rem;
            margin-bottom: 5px;
        }

        .compact-card p {
            font-size: 0.85rem;
            margin-bottom: 20px;
        }

        .compact-input-group {
            margin-bottom: 1rem; /* Tighter gap between fields */
            text-align: left;
        }

        .compact-input-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .compact-input-group input {
            width: 100%;
            padding: 10px 15px; /* Slimmer inputs */
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 8px; /* Less rounded for a cleaner, professional look */
            color: white;
            font-family: var(--font-main);
            font-size: 0.9rem;
            outline: none;
            transition: 0.3s;
        }

        .compact-input-group input:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.15);
        }

        .btn-compact {
            padding: 12px 24px;
            font-size: 0.9rem;
            border-radius: 8px;
        }

        /* Fade-in animation for smooth form switching */
        .fade-switch {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* NEW: Error Box Styling matching your compact theme */
        #errorBox {
            color: #ff4d4d;
            background: rgba(255, 77, 77, 0.1);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(255, 77, 77, 0.3);
            font-size: 0.85rem;
            margin-bottom: 15px;
            display: none;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="futuristic-bg">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <!-- Back to home button -->
    <a href="index.html" style="position: absolute; top: 30px; left: 30px; color: white; text-decoration: none; font-weight: bold; z-index: 100; font-size: 0.9rem;">
        <i class="fas fa-arrow-left"></i> Back to Home
    </a>

    <div class="login-wrapper fade-up visible">
        <div class="glass compact-card">
            <img src="https://lh3.googleusercontent.com/d/17XCKA0821hxjZghFPT4FEVmcvagMDqrn" alt="Anvex Media Logo">
            
            <!-- Global Error Box -->
            <div id="errorBox"></div>
            
            <!-- ================= LOGIN SECTION ================= -->
            <div id="login-section" class="fade-switch">
                <h2>Welcome Back</h2>
                <p>Sign in to access your dashboard.</p>

                <form id="loginForm">
                    <div class="compact-input-group">
                        <label for="login-email">Email Address</label>
                        <input type="email" id="login-email" placeholder="hello@yourbusiness.com" required>
                    </div>
                    <div class="compact-input-group">
                        <label for="login-password">Password</label>
                        <input type="password" id="login-password" placeholder="Enter your password" required>
                    </div>
                    <button type="submit" id="loginBtn" class="btn btn-primary btn-compact" style="width: 100%; margin-top: 5px;">Login Securely</button>
                </form>

                <div style="margin-top: 20px;">
                    <p style="margin: 0; font-size: 0.85rem;">Don't have an account? <span onclick="toggleForms()" style="color: var(--accent-blue); text-decoration: none; cursor: pointer; font-weight: 600;">Sign Up</span></p>
                </div>
            </div>

            <!-- ================= SIGN UP SECTION (Initially Hidden) ================= -->
            <div id="signup-section" class="fade-switch" style="display: none;">
                <h2>Create Account</h2>
                <p>Join us and start dominating your local market.</p>

                <form id="signupForm">
                    <div class="compact-input-group">
                        <label for="reg-name">Full Name</label>
                        <input type="text" id="reg-name" placeholder="John Doe" required>
                    </div>
                    <div class="compact-input-group">
                        <label for="reg-business">Business Name</label>
                        <input type="text" id="reg-business" placeholder="e.g. Elite Motors" required>
                    </div>
                    <div class="compact-input-group">
                        <label for="reg-location">Business Location</label>
                        <input type="text" id="reg-location" placeholder="City or area" required>
                    </div>
                    <div class="compact-input-group">
                        <label for="reg-email">Email Address</label>
                        <input type="email" id="reg-email" placeholder="hello@yourbusiness.com" required>
                    </div>
                    <div class="compact-input-group">
                        <label for="reg-password">Password</label>
                        <input type="password" id="reg-password" placeholder="Create a strong password" required>
                    </div>
                    <button type="submit" id="signupBtn" class="btn btn-primary btn-compact" style="width: 100%; margin-top: 5px;">Create Account</button>
                </form>

                <div style="margin-top: 20px;">
                    <p style="margin: 0; font-size: 0.85rem;">Already have an account? <span onclick="toggleForms()" style="color: var(--accent-blue); text-decoration: none; cursor: pointer; font-weight: 600;">Log In</span></p>
                </div>
            </div>

        </div>
    </div>

    <!-- FIREBASE SCRIPTS -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>

    <script>
        // 1. Simple JavaScript to toggle between Login and Sign Up
        function toggleForms() {
            const loginSection = document.getElementById('login-section');
            const signupSection = document.getElementById('signup-section');
            const errorBox = document.getElementById('errorBox');
            
            errorBox.style.display = 'none'; // Clear errors on toggle

            if (loginSection.style.display === 'none') {
                loginSection.style.display = 'block';
                signupSection.style.display = 'none';
            } else {
                loginSection.style.display = 'none';
                signupSection.style.display = 'block';
            }
        }

        // 2. Initialize Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyAxx30DLPsU_CqMqihS1HE-3kMgRxY3oio",
            authDomain: "anvex-media.firebaseapp.com",
            projectId: "anvex-media",
            storageBucket: "anvex-media.firebasestorage.app",
            messagingSenderId: "941745194100",
            appId: "1:941745194100:web:8a6b718bb4bd54d9733d21"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        const errorBox = document.getElementById('errorBox');

        // ==========================================
        // 3. LOGIN LOGIC
        // ==========================================
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('login-email').value.trim().toLowerCase();
            const password = document.getElementById('login-password').value;
            const loginBtn = document.getElementById('loginBtn');

            // Button loading state
            loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Authenticating...';
            loginBtn.disabled = true;
            errorBox.style.display = 'none';

            try {
                // Authenticate
                await auth.signInWithEmailAndPassword(email, password);

                // Check Role in Database
                const userDoc = await db.collection('users').doc(email).get();

                if (userDoc.exists && userDoc.data().role === 'admin') {
                    window.location.href = "admin.html"; // Route to Admin
                } else {
                    window.location.href = "client.html"; // Route to Client
                }

            } catch (error) {
                if(error.code === 'auth/wrong-password' || error.code === 'auth/user-not-found' || error.code === 'auth/invalid-credential') {
                    errorBox.innerText = "Invalid email or password.";
                } else {
                    errorBox.innerText = error.message;
                }
                errorBox.style.display = 'block';
                loginBtn.innerHTML = 'Login Securely';
                loginBtn.disabled = false;
            }
        });

        // ==========================================
        // 4. SIGN UP LOGIC
        // ==========================================
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const name = document.getElementById('reg-name').value;
            const business = document.getElementById('reg-business').value;
            const location = document.getElementById('reg-location').value;
            const email = document.getElementById('reg-email').value.trim().toLowerCase();
            const password = document.getElementById('reg-password').value;
            const signupBtn = document.getElementById('signupBtn');

            // Button loading state
            signupBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating...';
            signupBtn.disabled = true;
            errorBox.style.display = 'none';

            try {
                // 1. Create the user in Firebase Auth
                await auth.createUserWithEmailAndPassword(email, password);

                // 2. Save their profile data in Firestore
                await db.collection('users').doc(email).set({
                    fullName: name,
                    businessName: business,
                    location: location,
                    email: email,
                    role: "client", // Automatically assigns them the client role
                    joinedAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                // 3. Send them directly to the client dashboard
                window.location.href = "client.html";

            } catch (error) {
                if(error.code === 'auth/email-already-in-use') {
                    errorBox.innerText = "An account with this email already exists.";
                } else if(error.code === 'auth/weak-password') {
                    errorBox.innerText = "Password must be at least 6 characters long.";
                } else {
                    errorBox.innerText = error.message;
                }
                errorBox.style.display = 'block';
                signupBtn.innerHTML = 'Create Account';
                signupBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
