<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Sign Up | Anvex Media</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 20px; 
        }
        
        .compact-card {
            width: 100%;
            max-width: 400px; 
            padding: 2rem !important; 
            border-radius: 20px;
        }

        .compact-card img {
            height: 45px; 
            margin-bottom: 1rem;
        }

        .compact-card h2 {
            font-size: 1.5rem;
            margin-bottom: 5px;
        }

        .compact-card p {
            font-size: 0.85rem;
            margin-bottom: 20px;
        }

        .compact-input-group {
            margin-bottom: 1rem; 
            text-align: left;
        }

        .compact-input-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .compact-input-group input {
            width: 100%;
            padding: 10px 15px; 
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 8px; 
            color: white;
            font-family: var(--font-main);
            font-size: 0.9rem;
            outline: none;
            transition: 0.3s;
            box-sizing: border-box;
        }

        .compact-input-group input:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.15);
        }

        .btn-compact {
            padding: 12px 24px;
            font-size: 0.9rem;
            border-radius: 8px;
        }

        .fade-switch {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #errorBox {
            color: #ff4d4d;
            background: rgba(255, 77, 77, 0.1);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 77, 77, 0.3);
            font-size: 0.85rem;
            margin-bottom: 15px;
            display: none;
            text-align: center;
            transition: 0.3s;
            line-height: 1.4;
        }

        .success-box {
            color: #25d366 !important;
            background: rgba(37, 211, 102, 0.1) !important;
            border-color: rgba(37, 211, 102, 0.3) !important;
        }
        
        .phone-input-wrapper {
            display: flex; 
            align-items: center; 
            background: rgba(255, 255, 255, 0.05); 
            border: 1px solid var(--glass-border); 
            border-radius: 8px; 
            overflow: hidden;
            transition: 0.3s;
        }
        .phone-input-wrapper:focus-within {
            border-color: var(--accent-blue);
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.15);
        }
        .phone-prefix {
            padding: 10px 15px; 
            color: white; 
            background: rgba(0,0,0,0.3); 
            border-right: 1px solid var(--glass-border); 
            font-weight: 600;
        }
        .phone-input-wrapper input {
            border: none; 
            background: transparent; 
            box-shadow: none; 
            border-radius: 0;
            width: 100%;
        }
        .phone-input-wrapper input:focus {
            box-shadow: none;
            border-color: transparent;
        }
    </style>
</head>
<body>

    <div class="futuristic-bg">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <a href="index.html" style="position: absolute; top: 30px; left: 30px; color: white; text-decoration: none; font-weight: bold; z-index: 100; font-size: 0.9rem;">
        <i class="fas fa-arrow-left"></i> Back to Home
    </a>

    <div class="login-wrapper fade-up visible">
        <div class="glass compact-card">
            <img src="logo1.png" alt="Anvex Media Logo">
            
            <div id="errorBox"></div>
            
            <!-- LOGIN SECTION -->
            <div id="login-section" class="fade-switch">
                <h2>Welcome Back</h2>
                <p>Sign in to access your dashboard.</p>

                <form id="loginForm">
                    <div class="compact-input-group">
                        <label for="login-email">Email Address</label>
                        <input type="email" id="login-email" placeholder="hello@yourbusiness.com" required>
                    </div>
                    <div class="compact-input-group">
                        <label for="login-password">Password</label>
                        <input type="password" id="login-password" placeholder="Enter your password" required>
                    </div>
                    <button type="submit" id="loginBtn" class="btn btn-primary btn-compact" style="width: 100%; margin-top: 5px;">Login Securely</button>
                </form>

                <div style="margin-top: 20px;">
                    <p style="margin: 0; font-size: 0.85rem;">Don't have an account? <span onclick="toggleForms()" style="color: var(--accent-blue); text-decoration: none; cursor: pointer; font-weight: 600;">Sign Up</span></p>
                </div>
            </div>

            <!-- SIGN UP SECTION -->
            <div id="signup-section" class="fade-switch" style="display: none;">
                <h2>Create Account</h2>
                <p>Join us and start dominating your local market.</p>

                <form id="signupForm">
                    <div class="compact-input-group">
                        <label for="reg-name">Full Name</label>
                        <input type="text" id="reg-name" placeholder="John Doe" required>
                    </div>
                    <div class="compact-input-group">
                        <label for="reg-business">Business Name</label>
                        <input type="text" id="reg-business" placeholder="e.g. Elite Motors" required>
                    </div>
                    <div class="compact-input-group">
                        <label for="reg-location">Business Location</label>
                        <input type="text" id="reg-location" placeholder="City or area" required>
                    </div>
                    <div class="compact-input-group">
                        <label for="reg-email">Email Address</label>
                        <input type="email" id="reg-email" placeholder="hello@yourbusiness.com" required>
                    </div>
                    <div class="compact-input-group">
                        <label for="reg-phone">Mobile Number</label>
                        <div class="phone-input-wrapper">
                            <div class="phone-prefix">+91</div>
                            <input type="tel" id="reg-phone" placeholder="10-digit number" required maxlength="10">
                        </div>
                    </div>
                    <div class="compact-input-group">
                        <label for="reg-password">Password</label>
                        <input type="password" id="reg-password" placeholder="Create a strong password" required>
                    </div>
                    
                    <button type="submit" id="signupBtn" class="btn btn-primary btn-compact" style="width: 100%; margin-top: 5px;">Create Account</button>
                </form>

                <div style="margin-top: 20px;">
                    <p style="margin: 0; font-size: 0.85rem;">Already have an account? <span onclick="toggleForms()" style="color: var(--accent-blue); text-decoration: none; cursor: pointer; font-weight: 600;">Log In</span></p>
                </div>
            </div>

        </div>
    </div>

    <!-- FIREBASE SCRIPTS -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: atob("QUl6YVN5QXh4MzBETFBzVV9DcU1xaWhTMUhFLTNrTWdSeFkzb2lv"),
            authDomain: "anvex-media.firebaseapp.com",
            projectId: "anvex-media",
            storageBucket: "anvex-media.firebasestorage.app",
            messagingSenderId: "941745194100",
            appId: "1:941745194100:web:8a6b718bb4bd54d9733d21"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const errorBox = document.getElementById('errorBox');

        // This flag stops the background listener from ruining our form submissions
        let isHandlingAuth = false;

        // SESSION PERSISTENCE CHECK (Only runs on page load/refresh)
        auth.onAuthStateChanged(async (user) => {
            if (isHandlingAuth) return; // If we are actively clicking buttons, ignore this

            if (user) {
                if (!user.emailVerified) {
                    await auth.signOut();
                    return; 
                }

                const userDoc = await db.collection('users').doc(user.email).get();
                if (userDoc.exists && userDoc.data().role === 'admin') {
                    window.location.href = "admin.html";
                } else if (userDoc.exists && userDoc.data().role === 'client') {
                    window.location.href = "client.html";
                }
            }
        });

        function toggleForms() {
            const loginSection = document.getElementById('login-section');
            const signupSection = document.getElementById('signup-section');
            errorBox.style.display = 'none'; 
            errorBox.classList.remove('success-box');

            if (loginSection.style.display === 'none') {
                loginSection.style.display = 'block';
                signupSection.style.display = 'none';
            } else {
                loginSection.style.display = 'none';
                signupSection.style.display = 'block';
            }
        }

        function showMessage(msg, isSuccess = false) {
            errorBox.innerHTML = msg;
            if(isSuccess) {
                errorBox.classList.add('success-box');
            } else {
                errorBox.classList.remove('success-box');
            }
            errorBox.style.display = 'block';
        }

        // ==========================
        // LOGIN LOGIC
        // ==========================
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            isHandlingAuth = true; // Pause background listener
            
            const email = document.getElementById('login-email').value.trim().toLowerCase();
            const password = document.getElementById('login-password').value;
            const loginBtn = document.getElementById('loginBtn');

            loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Authenticating...';
            loginBtn.disabled = true;
            errorBox.style.display = 'none';

            try {
                const userCredential = await auth.signInWithEmailAndPassword(email, password);
                
                // CHECK IF VERIFIED
                if (!userCredential.user.emailVerified) {
                    showMessage(`
                        <i class="fas fa-exclamation-triangle"></i> Please verify your email address before logging in.<br>
                        <div style="margin-top: 10px;">
                            <a href="#" id="resendEmailBtn" style="color: var(--accent-blue); font-weight: bold; text-decoration: none; border-bottom: 1px dashed var(--accent-blue);">Resend Verification Email</a>
                        </div>
                    `);

                    document.getElementById('resendEmailBtn').addEventListener('click', async (event) => {
                        event.preventDefault();
                        const lnk = event.target;
                        lnk.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...';
                        lnk.style.pointerEvents = 'none'; 
                        
                        try {
                            await userCredential.user.sendEmailVerification();
                            showMessage('<i class="fas fa-envelope-open-text"></i> Verification email sent! Please check your inbox and spam folder.', true);
                            await auth.signOut();
                            isHandlingAuth = false;
                        } catch (err) {
                            if (err.code === 'auth/too-many-requests') {
                                showMessage('<i class="fas fa-exclamation-triangle"></i> Too many requests. Please wait a few minutes before resending.');
                            } else {
                                showMessage("Error: " + err.message);
                            }
                            await auth.signOut();
                            isHandlingAuth = false;
                        }
                    });

                    loginBtn.innerHTML = 'Login Securely';
                    loginBtn.disabled = false;
                    return; 
                }
                
                // IF VERIFIED, REDIRECT MANUALLY
                const userDoc = await db.collection('users').doc(email).get();
                if (userDoc.exists && userDoc.data().role === 'admin') {
                    window.location.href = "admin.html";
                } else {
                    window.location.href = "client.html";
                }

            } catch (error) {
                if(error.code === 'auth/user-not-found') {
                    showMessage("Email not registered. Redirecting to Sign Up...");
                    setTimeout(() => {
                        toggleForms();
                        document.getElementById('reg-email').value = email;
                        errorBox.style.display = 'none';
                    }, 1500);
                } else if(error.code === 'auth/wrong-password') {
                    showMessage("Incorrect password. Please try again.");
                } else {
                    showMessage("Invalid credentials. Please try again.");
                }
                
                loginBtn.innerHTML = 'Login Securely';
                loginBtn.disabled = false;
                isHandlingAuth = false;
            }
        });

        // ==========================
        // SIGN UP LOGIC
        // ==========================
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            isHandlingAuth = true; // Pause background listener
            
            const name = document.getElementById('reg-name').value.trim();
            const business = document.getElementById('reg-business').value.trim();
            const location = document.getElementById('reg-location').value.trim();
            const email = document.getElementById('reg-email').value.trim().toLowerCase();
            const password = document.getElementById('reg-password').value;
            const phone = document.getElementById('reg-phone').value.trim();
            const signupBtn = document.getElementById('signupBtn');

            if(phone.length !== 10 || isNaN(phone)) {
                showMessage("Please enter a valid 10-digit mobile number.");
                isHandlingAuth = false;
                return;
            }

            signupBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating...';
            signupBtn.disabled = true;
            errorBox.style.display = 'none';

            try {
                const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                await userCredential.user.sendEmailVerification();

                // Save ALL data to Firestore while technically logged in
                await db.collection('users').doc(email).set({
                    fullName: name,
                    businessName: business,
                    location: location,
                    email: email,
                    phone: "+91" + phone,
                    role: "client", 
                    joinedAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                // Safely sign out now that data is saved
                await auth.signOut();
                isHandlingAuth = false; // Turn background listener back on

                toggleForms();
                document.getElementById('login-email').value = email;
                showMessage('<i class="fas fa-envelope-open-text"></i> Account created successfully!<br>We have sent a verification link to your email. Please verify your email before logging in.', true);
                
                signupBtn.innerHTML = 'Create Account';
                signupBtn.disabled = false;

            } catch (error) {
                if(error.code === 'auth/email-already-in-use') {
                    showMessage("An account with this email already exists.");
                } else if(error.code === 'auth/weak-password') {
                    showMessage("Password must be at least 6 characters long.");
                } else {
                    showMessage(error.message);
                }
                signupBtn.innerHTML = 'Create Account';
                signupBtn.disabled = false;
                isHandlingAuth = false;
            }
        });
    </script>
</body>
</html>
