<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Anvex Media</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="futuristic-bg">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <!-- Back to home button -->
    <a href="index.html" style="position: absolute; top: 30px; left: 30px; color: white; text-decoration: none; font-weight: bold; z-index: 100;">
        <i class="fas fa-arrow-left"></i> Back to Home
    </a>

    <div class="login-wrapper fade-up visible">
        <div class="glass login-card">
            <img src="https://lh3.googleusercontent.com/d/17XCKA0821hxjZghFPT4FEVmcvagMDqrn" alt="Anvex Media Logo">
            <h2 style="margin-bottom: 5px;">Welcome Back</h2>
            <p style="margin-bottom: 30px; font-size: 0.9rem;">Sign in to access your client dashboard.</p>

            <form action="#">
                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="Enter your email" required>
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">Login securely</button>
            </form>

            <div style="margin-top: 25px;">
                <p style="margin: 0; font-size: 0.9rem;">Don't have an account? <a href="#" style="color: var(--accent-blue); text-decoration: none;">Sign Up</a></p>
            </div>
        </div>
    </div>

</body>
</html>
