<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Sign Up | Anvex Media</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 20px; 
        }
        
        .compact-card {
            width: 100%;
            max-width: 400px; 
            padding: 2rem !important; 
            border-radius: 20px;
        }

        .compact-card img {
            height: 45px; 
            margin-bottom: 1rem;
        }

        .compact-card h2 {
            font-size: 1.5rem;
            margin-bottom: 5px;
        }

        .compact-card p {
            font-size: 0.85rem;
            margin-bottom: 20px;
        }

        .compact-input-group {
            margin-bottom: 1rem; 
            text-align: left;
        }

        .compact-input-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .compact-input-group input {
            width: 100%;
            padding: 10px 15px; 
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 8px; 
            color: white;
            font-family: var(--font-main);
            font-size: 0.9rem;
            outline: none;
            transition: 0.3s;
            box-sizing: border-box;
        }

        .compact-input-group input:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.15);
        }

        .btn-compact {
            padding: 12px 24px;
            font-size: 0.9rem;
            border-radius: 8px;
        }

        .fade-switch {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #errorBox {
            color: #ff4d4d;
            background: rgba(255, 77, 77, 0.1);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(255, 77, 77, 0.3);
            font-size: 0.85rem;
            margin-bottom: 15px;
            display: none;
            text-align: center;
            transition: 0.3s;
        }
        
        /* Custom Input Styling for Phone */
        .phone-input-wrapper {
            display: flex; 
            align-items: center; 
            background: rgba(255, 255, 255, 0.05); 
            border: 1px solid var(--glass-border); 
            border-radius: 8px; 
            overflow: hidden;
            transition: 0.3s;
        }
        .phone-input-wrapper:focus-within {
            border-color: var(--accent-blue);
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.15);
        }
        .phone-prefix {
            padding: 10px 15px; 
            color: white; 
            background: rgba(0,0,0,0.3); 
            border-right: 1px solid var(--glass-border); 
            font-weight: 600;
        }
        .phone-input-wrapper input {
            border: none; 
            background: transparent; 
            box-shadow: none; 
            border-radius: 0;
            width: 100%;
        }
        .phone-input-wrapper input:focus {
            box-shadow: none;
            border-color: transparent;
        }
    </style>
</head>
<body>

    <div class="futuristic-bg">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <a href="index.html" style="position: absolute; top: 30px; left: 30px; color: white; text-decoration: none; font-weight: bold; z-index: 100; font-size: 0.9rem;">
        <i class="fas fa-arrow-left"></i> Back to Home
    </a>

    <div class="login-wrapper fade-up visible">
        <div class="glass compact-card">
            <img src="logo1.png" alt="Anvex Media Logo">
            
            <div id="errorBox"></div>
            
            <!-- LOGIN SECTION -->
            <div id="login-section" class="fade-switch">
                <h2>Welcome Back</h2>
                <p>Sign in to access your dashboard.</p>

                <form id="loginForm">
                    <div class="compact-input-group">
                        <label for="login-email">Email Address</label>
                        <input type="email" id="login-email" placeholder="hello@yourbusiness.com" required>
                    </div>
                    <div class="compact-input-group">
                        <label for="login-password">Password</label>
                        <input type="password" id="login-password" placeholder="Enter your password" required>
                    </div>
                    <button type="submit" id="loginBtn" class="btn btn-primary btn-compact" style="width: 100%; margin-top: 5px;">Login Securely</button>
                </form>

                <div style="margin-top: 20px;">
                    <p style="margin: 0; font-size: 0.85rem;">Don't have an account? <span onclick="toggleForms()" style="color: var(--accent-blue); text-decoration: none; cursor: pointer; font-weight: 600;">Sign Up</span></p>
                </div>
            </div>

            <!-- SIGN UP SECTION (WITH OTP) -->
            <div id="signup-section" class="fade-switch" style="display: none;">
                <h2>Create Account</h2>
                <p>Join us and start dominating your local market.</p>

                <!-- Note: using onsubmit="event.preventDefault();" because we handle the clicks manually for OTP -->
                <form id="signupForm" onsubmit="event.preventDefault();">
                    
                    <div id="primarySignupFields">
                        <div class="compact-input-group">
                            <label for="reg-name">Full Name</label>
                            <input type="text" id="reg-name" placeholder="John Doe" required>
                        </div>
                        <div class="compact-input-group">
                            <label for="reg-business">Business Name</label>
                            <input type="text" id="reg-business" placeholder="e.g. Elite Motors" required>
                        </div>
                        <div class="compact-input-group">
                            <label for="reg-location">Business Location</label>
                            <input type="text" id="reg-location" placeholder="City or area" required>
                        </div>
                        <div class="compact-input-group">
                            <label for="reg-email">Email Address</label>
                            <input type="email" id="reg-email" placeholder="hello@yourbusiness.com" required>
                        </div>
                        <div class="compact-input-group">
                            <label for="reg-password">Password</label>
                            <input type="password" id="reg-password" placeholder="Create a strong password" required>
                        </div>
                        <div class="compact-input-group">
                            <label for="reg-phone">Mobile Number</label>
                            <div class="phone-input-wrapper">
                                <div class="phone-prefix">+91</div>
                                <input type="tel" id="reg-phone" placeholder="10-digit number" required maxlength="10">
                            </div>
                        </div>
                    </div>

                    <!-- Hidden OTP Field -->
                    <div class="compact-input-group" id="otpGroup" style="display: none; margin-top: 15px;">
                        <label for="reg-otp" style="color: #25d366;"><i class="fas fa-check-circle"></i> OTP Sent to Mobile</label>
                        <input type="text" id="reg-otp" placeholder="Enter 6-digit code" maxlength="6" style="border: 1px solid #25d366;">
                    </div>

                    <!-- Firebase invisible Recaptcha container -->
                    <div id="recaptcha-container"></div>

                    <button type="button" id="sendOtpBtn" class="btn btn-primary btn-compact" style="width: 100%; margin-top: 5px;">Send OTP to Verify</button>
                    <button type="button" id="verifySignupBtn" class="btn btn-primary btn-compact" style="width: 100%; margin-top: 5px; display: none;">Verify & Create Account</button>
                </form>

                <div style="margin-top: 20px;" id="loginLinkText">
                    <p style="margin: 0; font-size: 0.85rem;">Already have an account? <span onclick="toggleForms()" style="color: var(--accent-blue); text-decoration: none; cursor: pointer; font-weight: 600;">Log In</span></p>
                </div>
            </div>

        </div>
    </div>

    <!-- FIREBASE SCRIPTS -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: atob("QUl6YVN5QXh4MzBETFBzVV9DcU1xaWhTMUhFLTNrTWdSeFkzb2lv"),
            authDomain: "anvex-media.firebaseapp.com",
            projectId: "anvex-media",
            storageBucket: "anvex-media.firebasestorage.app",
            messagingSenderId: "941745194100",
            appId: "1:941745194100:web:8a6b718bb4bd54d9733d21"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const errorBox = document.getElementById('errorBox');
        
        let confirmationResult = null; // Stores the OTP session

        // SESSION PERSISTENCE CHECK (Auto-redirect if already logged in)
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                const userDoc = await db.collection('users').doc(user.email).get();
                if (userDoc.exists && userDoc.data().role === 'admin') {
                    window.location.href = "admin.html";
                } else if (userDoc.exists && userDoc.data().role === 'client') {
                    window.location.href = "client.html";
                }
            }
        });

        function toggleForms() {
            const loginSection = document.getElementById('login-section');
            const signupSection = document.getElementById('signup-section');
            errorBox.style.display = 'none'; 

            if (loginSection.style.display === 'none') {
                loginSection.style.display = 'block';
                signupSection.style.display = 'none';
            } else {
                loginSection.style.display = 'none';
                signupSection.style.display = 'block';
            }
        }

        // ==========================
        // LOGIN LOGIC
        // ==========================
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value.trim().toLowerCase();
            const password = document.getElementById('login-password').value;
            const loginBtn = document.getElementById('loginBtn');

            loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Authenticating...';
            loginBtn.disabled = true;
            errorBox.style.display = 'none';

            try {
                await auth.signInWithEmailAndPassword(email, password);
                // Auto-redirect handled by onAuthStateChanged
            } catch (error) {
                if(error.code === 'auth/user-not-found') {
                    errorBox.innerText = "Email not registered. Redirecting to Sign Up...";
                    errorBox.style.display = 'block';
                    
                    setTimeout(() => {
                        toggleForms();
                        document.getElementById('reg-email').value = email;
                        errorBox.style.display = 'none';
                    }, 1500);

                } else if(error.code === 'auth/wrong-password') {
                    errorBox.innerText = "Incorrect password. Please try again.";
                    errorBox.style.display = 'block';
                } else {
                    errorBox.innerText = "Invalid credentials. Please try again.";
                    errorBox.style.display = 'block';
                }
                
                loginBtn.innerHTML = 'Login Securely';
                loginBtn.disabled = false;
            }
        });

        // ==========================
        // STEP 1: SEND OTP LOGIC
        // ==========================
        document.getElementById('sendOtpBtn').addEventListener('click', async () => {
            errorBox.style.display = 'none';

            // Gather values
            const name = document.getElementById('reg-name').value.trim();
            const business = document.getElementById('reg-business').value.trim();
            const location = document.getElementById('reg-location').value.trim();
            const email = document.getElementById('reg-email').value.trim().toLowerCase();
            const password = document.getElementById('reg-password').value;
            const phone = document.getElementById('reg-phone').value.trim();

            // Simple Form Validation
            if(!name || !business || !location || !email || !password || !phone) {
                errorBox.innerText = "Please fill in all details before verifying.";
                errorBox.style.display = 'block';
                return;
            }

            if(phone.length !== 10 || isNaN(phone)) {
                errorBox.innerText = "Please enter a valid 10-digit mobile number.";
                errorBox.style.display = 'block';
                return;
            }

            const sendBtn = document.getElementById('sendOtpBtn');
            sendBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending OTP...';
            sendBtn.disabled = true;

            const fullPhoneNumber = "+91" + phone;

            try {
                // Initialize Firebase Recaptcha (invisible)
                if(!window.recaptchaVerifier) {
                    window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', { 'size': 'invisible' });
                }

                // Send the text message
                confirmationResult = await auth.signInWithPhoneNumber(fullPhoneNumber, window.recaptchaVerifier);

                // Hide the main fields so they don't change them, reveal OTP box
                document.getElementById('primarySignupFields').style.display = 'none';
                document.getElementById('loginLinkText').style.display = 'none';
                sendBtn.style.display = 'none';

                document.getElementById('otpGroup').style.display = 'block';
                document.getElementById('verifySignupBtn').style.display = 'block';

            } catch (error) {
                console.error(error);
                errorBox.innerText = "Error sending OTP: " + error.message;
                errorBox.style.display = 'block';
                sendBtn.innerHTML = 'Send OTP to Verify';
                sendBtn.disabled = false;
                
                // Reset recaptcha if it failed
                if(window.recaptchaVerifier) {
                    window.recaptchaVerifier.clear();
                    window.recaptchaVerifier = null;
                }
            }
        });

        // ==========================
        // STEP 2: VERIFY OTP & CREATE PROFILE
        // ==========================
        document.getElementById('verifySignupBtn').addEventListener('click', async () => {
            errorBox.style.display = 'none';
            const otp = document.getElementById('reg-otp').value.trim();

            if(otp.length < 6) {
                errorBox.innerText = "Please enter the 6-digit OTP code.";
                errorBox.style.display = 'block';
                return;
            }

            const verifyBtn = document.getElementById('verifySignupBtn');
            verifyBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Verifying & Creating...';
            verifyBtn.disabled = true;

            try {
                // 1. Check if OTP is correct (This signs them into Firebase via Phone)
                const result = await confirmationResult.confirm(otp);
                const user = result.user;

                // 2. Link their Email and Password to this verified phone account
                const email = document.getElementById('reg-email').value.trim().toLowerCase();
                const password = document.getElementById('reg-password').value;
                const credential = firebase.auth.EmailAuthProvider.credential(email, password);

                try {
                    await user.linkWithCredential(credential);
                } catch (linkError) {
                    if (linkError.code === 'auth/email-already-in-use' || linkError.code === 'auth/credential-already-in-use') {
                        throw new Error("This email is already registered. Please log in instead.");
                    } else {
                        throw linkError; // Throw other unexpected errors
                    }
                }

                // 3. Gather final data
                const name = document.getElementById('reg-name').value.trim();
                const business = document.getElementById('reg-business').value.trim();
                const location = document.getElementById('reg-location').value.trim();
                const fullPhoneNumber = "+91" + document.getElementById('reg-phone').value.trim();

                // 4. Write full profile (including verified phone) to database
                await db.collection('users').doc(email).set({
                    fullName: name,
                    businessName: business,
                    location: location,
                    email: email,
                    phone: fullPhoneNumber,
                    role: "client", 
                    joinedAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                // Success! `onAuthStateChanged` will automatically redirect them to `client.html`

            } catch (error) {
                console.error(error);
                if (error.code === 'auth/invalid-verification-code') {
                    errorBox.innerText = "Incorrect OTP code. Please try again.";
                } else {
                    errorBox.innerText = error.message;
                }
                errorBox.style.display = 'block';
                verifyBtn.innerHTML = 'Verify & Create Account';
                verifyBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
